[project]
name = "ephemeral-server"
version = "0.1.0"
description = "Ephemeral - Mensajeria segura E2EE (UD-Chat)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2.0",
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "pynacl>=1.5,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[dependency-groups]
dev = [
    "cryptography>=44.0,<45.0",
    "diff-cover>=9.0,<10.0",
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --cov=app --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "\\.\\.\\.",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
