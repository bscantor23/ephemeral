[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --cov=app --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "\\.\\.\\.",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
