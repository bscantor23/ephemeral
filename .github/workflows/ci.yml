name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  security-gitleaks:
    name: Escaneo de Secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Action
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests-and-coverage:
    name: Pruebas y Cobertura (Backend con uv)
    runs-on: ubuntu-latest
    needs: security-gitleaks
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Instalar dependencias
        run: |
          uv sync --all-groups --frozen

      - name: Ejecutar pruebas y reporte de cobertura
        run: |
          uv run pytest --cov=app --cov-report=xml:coverage.xml

      - name: Validar cobertura en codigo nuevo (minimo 80%)
        if: github.event_name == 'pull_request'
        run: |
          uv run diff-cover coverage.xml --compare-branch=origin/main --fail-under=80 --include="app/**"

      - name: Ejecutar simulaciones de ataque Red Team
        run: |
          uv run python ../attacks/attack_a1_swap_spk.py
          uv run python ../attacks/attack_a2_swap_identity.py
          uv run python ../attacks/attack_a3_tamper.py
          uv run python ../attacks/attack_a4_replay.py
          uv run python ../attacks/attack_a5_db_dump.py
          uv run python ../attacks/attack_a6_forward_secrecy.py
