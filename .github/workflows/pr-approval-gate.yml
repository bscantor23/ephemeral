name: PR Approval Gatekeeper

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  pull-requests: read

jobs:
  check-pr-approval:
    name: Validar Aprobación Exclusiva de @bscantor23
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Verificar Autor y Aprobación
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          AUTHORIZED_APPROVER: "bscantor23"
        run: |
          echo "Evaluando Pull Request #${PR_NUMBER} creado por: '${PR_AUTHOR}'"

          if [ "${PR_AUTHOR}" = "${AUTHORIZED_APPROVER}" ]; then
            echo "✅ El PR fue creado por el usuario propietario (@${AUTHORIZED_APPROVER}). No requiere aprobación externa."
            exit 0
          fi

          echo "ℹ️ El PR fue creado por un usuario ajeno (@${PR_AUTHOR})."
          echo "🔍 Verificando aprobación obligatoria y exclusiva por parte de @${AUTHORIZED_APPROVER}..."

          REVIEWS=$(gh api "repos/${REPO_OWNER}/${REPO_NAME}/pulls/${PR_NUMBER}/reviews" \
            --jq '[.[] | select(.user.login == "'"${AUTHORIZED_APPROVER}"'") | .state] | last')

          echo "Último estado de revisión por @${AUTHORIZED_APPROVER}: '${REVIEWS}'"

          if [ "${REVIEWS}" = "APPROVED" ]; then
            echo "✅ Aprobación verificada: @${AUTHORIZED_APPROVER} ha aprobado este Pull Request."
            exit 0
          else
            echo "❌ ERROR: Este PR fue abierto por @${PR_AUTHOR} y requiere la aprobación explícita de @${AUTHORIZED_APPROVER}."
            echo "Estado actual: '${REVIEWS:-NINGUNA}'."
            echo "El merge está bloqueado hasta que @${AUTHORIZED_APPROVER} revise y apruebe los cambios."
            exit 1
          fi
